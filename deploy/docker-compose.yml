version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: always
    command: ["gunicorn", "-w", "2", "-k", "uvicorn.workers.UvicornWorker", "backend.app:app", "--bind", "0.0.0.0:8000", "--timeout", "120"]
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-aegissilicon-telemetry-archive-prod}
    depends_on:
      - kafka

  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: always
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.enableCORS=false", "--server.enableXsrfProtection=false", "--browser.gatherUsageStats=false"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8000
      - IN_DOCKER=true
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-aegissilicon-telemetry-archive-prod}
    depends_on:
      - backend
